[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catmaid-skeleton-batch-import"
version = "0.1.0"
description = "Production-oriented CATMAID SWC batch importer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.scripts]
catmaid-skeleton-import = "catmaid_skeleton_batch_import.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "e2e: opt-in tests that create hidden projects in a configured CATMAID database",
]
